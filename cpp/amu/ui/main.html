<html theme="dark">
<head>
<title>ARK Mod Updater</title>
<style>

:root {
  --bg: #0C0F14;
  --panel: #1D242E;
  --side: #11151C;
  --card: #1D242E;
  --card-hover: #171C25;
  --accent: #3DDC84;
  --on-accent: #08351F;
  --accent-dim: #12331F;
  --danger: #FF4D5E;
  --danger-dim: #3A1E22;
  --warn: #F5A623;
  --warn-dim: #3A2F10;
  --text: #EAEEF3;
  --muted: #93A0AE;
  --chip: #22262E;
  --line: #242B36;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
}
body { display: flex; flex-direction: column; overflow: hidden; }

/* ---------- scrollbars ---------- */
/* Sciter draws its own scrollbars (the light Windows-style bars are merely its
   built-in default) and styles them through @set blocks assigned per element:
   slim rounded thumb, no arrow buttons, track that blends into the panel.
   Assigned to the elements that actually scroll, never via `*`. Both .base and
   .back are styled because the SDK samples name the track part differently
   across engine versions.
   History: this block was once blamed for the sciter.dll crash at offset
   0x126f7a and removed; the real cause was a display-toggled child of a hidden
   container in the Config tab (see buildCfgRow). Re-added after the harness
   showed 0 crashes in 8 runs with it in place. */
@set amu-vscroll {
  .prev, .next { display: none; }
  .base, .back, .prev-page, .next-page { background: transparent; }
  .base, .back { width: 10px; }
  .slider { background: #2B3442; border-radius: 5px; margin: 2px; }
  .slider:hover { background: #3A4556; }
  .slider:active { background: #4A5768; }
  .corner { background: transparent; }
}
@set amu-hscroll {
  .prev, .next { display: none; }
  .base, .back, .prev-page, .next-page { background: transparent; }
  .base, .back { height: 10px; }
  .slider { background: #2B3442; border-radius: 5px; margin: 2px; }
  .slider:hover { background: #3A4556; }
  .slider:active { background: #4A5768; }
  .corner { background: transparent; }
}
#content, #updbox, .combolist, textarea, #modal .txt {
  vertical-scrollbar: amu-vscroll;
  horizontal-scrollbar: amu-hscroll;
}

/* ---------- header ---------- */
header {
  display: flex;
  align-items: center;
  flex: none;
  background: var(--side);
  border-bottom: 1px solid var(--line);
  padding: 15px 22px;
}
/* The app icon itself (same artwork as amu.ico / the window + taskbar icon).
   Relative URL on purpose: resolves under this://app/ when ui/ is packed into
   the exe AND under file:// when a loose dev ui\ folder next to amu.exe wins. */
header .logo { width: 24px; height: 24px; }
header h1 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  line-height: 1;
  margin: 0 0 0 12px;
}
header .grow { flex: 1; }
.wbtns { display: flex; }
.wbtn {
  width: 40px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  margin-left: 2px;
}
.wbtn:hover { background: var(--card-hover); color: var(--text); }
.wbtn.close:hover { background: #DF3535; color: #fff; }

/* ---------- layout ---------- */
main { flex: 1; display: flex; min-height: 0; }

aside {
  width: 190px;
  flex: none;
  background: var(--side);
  border-right: 1px solid var(--line);
  padding: 14px 12px;
  box-sizing: border-box;
}
.section {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin: 4px 10px 8px 10px;
}
.section + .section, div + .section { margin-top: 16px; }
.nav {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 4px;
}
.nav:hover { background: var(--card-hover); }
.nav.active {
  background: var(--panel);
  color: var(--text);
  border-left: 3px solid var(--accent);
  padding-left: 9px;
}
/* Sciter centers via vertical-align (browsers ignore it on flex items -> preview unaffected). */
header > *, footer > *, .nav > *, .pills > span, .thead > *, .trow > *, .kv > *,
.crumbrow > *, #statuscard > *, .toggle > *, .actions > *, .updbar > *, .updrow > *,
.addmodrow > *, .cfgbar > *, .cfgrow > *, .cval > *, #cfgfooter > *,
.updline > *, #updbanner > * { vertical-align: middle; }
.nav .dot { width: 7px; height: 7px; border-radius: 4px; margin-right: 8px; flex: none; vertical-align: middle; }
/* state-driven dot colors (sidebar + status card): running=green, starting/stopping=amber,
   crashed/failed=red, stopped/unknown=grey */
.dot.green { background: var(--accent); }
.dot.red   { background: var(--danger); }
.dot.amber { background: var(--warn); }
.dot.grey  { background: #6b7280; }
.dot.pulse { animation: dotpulse 1.2s infinite; }
@keyframes dotpulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
.nav .grow { flex: 1; }
/* server name: single line with ellipsis (a wrapping name pushed the row to
   two lines once the badge took its space); div, not span - Sciter flex rule */
.nav .nname {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 8px;
}
/* mod-count as a primary badge (fixed height + line-height, Sciter recipe) */
.nav .badge {
  flex: none;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 10.5px;
  font-weight: 600;
  height: 16px;
  line-height: 16px;
  padding: 0 6px;
  border-radius: 8px;
  text-align: center;
}

/* ---------- content ---------- */
#content { flex: 1; padding: 18px 22px; overflow: auto; box-sizing: border-box; }

/* tab pills styled EXACTLY like the standard buttons (same font, height,
   padding, border, radius and 8px gaps); active tab = primary-button green */
.pills { display: inline-flex; }
.pills span {
  height: 31px;        /* + 2x1px border = 33px, the button height */
  line-height: 31px;   /* fixed height + line-height (Sciter recipe) */
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  color: var(--text);
  font-size: 12.5px;
  cursor: pointer;
  margin-right: 8px;
}
.pills span:hover { background: var(--card-hover); border-color: #34404f; }
.pills span.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.crumb { margin: 14px 0 10px 0; font-size: 13px; }
.crumb b { color: var(--accent); font-weight: 400; }

/* mods table */
#modswrap { display: flex; align-items: flex-start; }
#modtable {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.thead, .trow {
  display: flex;
  align-items: center;
  padding: 8px 12px;
}
.thead {
  font-size: 11px;
  color: var(--muted);
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.trow { border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.trow:last-child { border-bottom: none; }
.trow:hover { background: rgba(255,255,255,0.045); }
.trow.sel { background: rgba(255,255,255,0.09); }
.trow.removedrow { background: rgba(229,72,77,0.12); }
.c-thumb { width: 44px; flex: none; }
/* mini workshop thumbnail; the grey .box is the fallback when no preview URL
   is cached yet (or the image fails to load) */
.c-thumb .box {
  width: 34px; height: 22px;
  border-radius: 6px;
  background: #2c3542;
}
.c-thumb .tmb { width: 34px; height: 22px; border-radius: 6px; }
.removedrow .c-thumb .box { background: #3a1e20; }
.c-id { width: 100px; flex: none; color: var(--muted); }
.c-status { width: 160px; flex: none; }
.c-name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.removedrow .c-name { color: var(--danger); }

.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
}
.pill.ok  { background: rgba(61,220,132,0.16);  color: #63E39C; border-color: rgba(61,220,132,0.40); }
.pill.inc { background: rgba(245,166,35,0.16);  color: #F7B84E; border-color: rgba(245,166,35,0.42); }
.pill.no  { background: rgba(147,160,174,0.14); color: #BAC4D2; border-color: rgba(147,160,174,0.34); }
.pill.rem { background: rgba(255,77,94,0.16);   color: #FF7A85; border-color: rgba(255,77,94,0.42); }

/* custom mouse-following tooltip (not the native title attribute) */
#tooltip {
  position: absolute;
  display: none;
  max-width: 260px;
  background: #1D242E;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--text);
  white-space: pre-line;   /* configurator tips carry \n (Default: / Example: lines) */
  box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  z-index: 1000;
}

/* "Workshop lookup running" state: the chip next to the Mods crumb and the
   placeholder thumbnails still waiting for an image. The pulse is a plain
   opacity animation - the one thing every engine handles - and if it were
   ignored the elements still read as a dimmed placeholder, so the screen never
   looks broken, only static. */
@keyframes amupulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
.loadchip { display: none; margin-left: 10px; font-size: 11.5px; font-weight: normal; color: var(--muted); }
.loadchip.on { display: inline-block; }
.loadchip .dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 4px;
  background: var(--accent);
  margin-right: 6px;
  vertical-align: middle;
  animation: amupulse 1s linear infinite;
}
.c-thumb .box.loading { animation: amupulse 1.2s linear infinite; }
#preview .img.loading { animation: amupulse 1.2s linear infinite; }

/* confirm modal: backdrop + centered card. Replaces the old two-click
   "Really remove?" arming of the button itself, which a double-click could
   fire straight through. */
#modal {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%;
  /* Sciter does not resolve height:100% on a fixed element against the
     window (the overlay collapsed to the card's height and sat at the top, no
     backdrop). Viewport units win where supported; askConfirm additionally
     sets an explicit pixel size from window.innerWidth/Height on open. */
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.55);
  display: none;
  z-index: 50;
}
#modal.on { display: block; }
/* The card is placed by askConfirm in pixels: with the overlay as a flex
   container Sciter honoured justify-content but not align-items, so the card
   stretched from top to bottom. Same measure-and-place approach as the tooltip. */
#modal .card {
  position: absolute; left: 0; top: 0;
  width: 440px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
#modal h3 { margin: 0 0 8px 0; font-size: 14px; font-weight: 600; }
/* .txt is what scrolls when the card would not fit the window: askConfirm
   caps its max-height (window minus margin minus title/buttons) on open */
#modal .txt { font-size: 12.5px; color: var(--muted); line-height: 1.5; white-space: pre-wrap; overflow-y: auto; }
#modal .btns { display: flex; justify-content: flex-end; margin-top: 16px; }
#modal .btns button { margin: 0 0 0 8px; }

/* preview card */
#preview {
  width: 230px;
  flex: none;
  margin-left: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  box-sizing: border-box;
}
#preview .img {
  height: 130px;
  border-radius: 8px;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
}
#preview h3 { font-size: 14px; font-weight: 600; margin: 12px 0 2px 0; }
#preview .id { color: var(--muted); font-size: 12px; }
#preview .kv { display: flex; margin-top: 8px; font-size: 12px; align-items: center; }
#preview .kv .k { width: 70px; flex: none; color: var(--muted); }
#preview a { color: var(--accent); font-size: 12px; cursor: pointer; }
#preview a:hover { text-decoration: underline; }

/* buttons - pill style like the mock */
.actions { margin-top: 12px; }
button {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 7px 16px;
  font-size: 12.5px;
  font-family: "Segoe UI", system-ui, sans-serif;
  cursor: pointer;
  margin-right: 8px;
}
button:hover { background: var(--card-hover); border-color: #34404f; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.primary:hover { background: #54E899; border-color: #54E899; }
/* destructive actions (Remove Mod, Delete Server): red text + red edge, red
   tint on hover - unmistakable next to the neutral buttons */
button.danger { color: var(--danger); border-color: rgba(223,53,53,0.45); }
button.danger:hover { background: rgba(223,53,53,0.14); border-color: var(--danger); }

/* server form */
.form { display: flex; gap: 16px; }
.form .colw { flex: 1; }
.field { margin-bottom: 12px; }
.field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.field input {
  display: block;
  width: 100%;
  height: 36px;
  line-height: 20px;
  box-sizing: border-box;
  background: #161A22;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  caret-color: #3DDC84;
  padding: 7px 10px;
  font-size: 13px;
  font-family: "Segoe UI", system-ui, sans-serif;
}
.field input:focus { border-color: var(--accent); }
/* Path field + "Browse..." button on one row (button matches the 36px input) */
.pathrow { display: flex; width: 100%; }
/* Two Sciter quirks in one rule:
   1. `.field input` sets `width: 100%` and Sciter's flex does NOT let
      flex-basis override it, so the input kept the full row width and shoved
      the button past the panel edge -> `width: auto` is the actual fix.
   2. Only the `flex` SHORTHAND is honoured; flex-grow/-basis longhands are
      ignored (that is why `.colw { flex: 1 }` works and a longhand column
      collapses to its content). max-width stays as the hard guard. */
.pathrow input {
  width: auto;
  flex: 1;
  max-width: calc(100% - 104px);
}
/* box-sizing is the point: the base `button` rule has none, so height:36px was
   CONTENT height and padding+border made the button 52px tall next to a 36px
   input. Fixed width keeps the input's max-width math exact (96 + 8 margin). */
.pathrow button {
  flex: none;
  box-sizing: border-box;
  width: 96px; height: 36px; line-height: 20px;
  padding: 7px 16px;
  margin: 0 0 0 8px;
}

/* Add Server lays its fields out as ONE full-width column (the Server screen
   keeps its two): every control spans the whole content area and its companion
   - the Game pills, the Browse button - sits flush on the right edge. */
.form.onecol { display: block; }
.form.onecol .colw { width: 100%; }
.widerow { display: flex; align-items: flex-start; }
/* `flex: 1` shorthand, exactly like `.colw` - see the .pathrow note above for
   why the flex-grow longhand collapses the field to nothing here. */
.widerow > .fgrow { flex: 1; }
.widerow > .fright { flex: none; margin-left: 16px; }
.gamesel span:last-child { margin-right: 0; }  /* pills end ON the right edge */

/* combobox: free-text input + a caret button opening a suggestion list (used for
   the Map field: official maps per game, but any custom/mod map can be typed) */
.combo { position: relative; }
.combo input { padding-right: 30px; }  /* room for the caret button */
.combo .caret {
  position: absolute;
  /* explicit height, NOT top+bottom: Sciter does not stretch absolute elements
     from opposing offsets - the container collapsed and clipped the arrow */
  right: 1px; top: 1px; height: 34px;
  width: 28px;
  cursor: pointer;
  border-radius: 0 7px 7px 0;
}
.combo .caret:hover { background: var(--card-hover); }
/* The arrow is a plain text glyph centered by line-height. Everything else was
   tried and did not render in Sciter (CSS border-triangles collapse, inline SVG
   and absolutely-positioned bar-divs draw nothing); a glyph does render. The
   field itself is clickable too, so the combobox works even if it looks off. */
.combo .caret {
  color: var(--muted);
  font-size: 11px;
  line-height: 34px;
  text-align: center;
}
.combo .caret:hover { color: var(--text); }
.combolist {
  position: absolute;
  /* explicit px offsets + width: Sciter resolves neither top:100% nor
     left+right stretching reliably (same class of bug as the caret height) */
  top: 40px; left: 0;
  width: 100%;
  box-sizing: border-box;
  max-height: 240px;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.55);
  z-index: 950;
}
.combolist .copt { padding: 7px 12px; cursor: pointer; font-size: 12.5px; }
.combolist .copt:hover { background: var(--card-hover); }
.combolist .copt .cn { font-size: 11px; color: var(--muted); }
.combolist .cempty { padding: 7px 12px; font-size: 12px; color: var(--muted); }

/* crumb row with the live status card on the right */
.crumbrow { display: flex; align-items: center; margin: 14px 0 10px 0; }
.crumbrow .crumb { margin: 0; }
.crumbrow .grow { flex: 1; }
#statuscard {
  display: flex;
  align-items: center;
  background: var(--side);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 14px;
}
/* dot + text column as divs, not spans: Sciter sizes fixed-width flex children reliably only on blocks */
#statuscard .dot { width: 10px; height: 10px; border-radius: 5px; margin-right: 10px; flex: none; }
#statuscard .slabel { font-size: 13px; font-weight: 600; line-height: 1.25; }
#statuscard .ssub { font-size: 11px; color: var(--muted); line-height: 1.25; }

/* launch options block */
.block { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 4px; }
.blabel { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 12px; }
.fieldrow { display: flex; gap: 12px; }
.field.half { flex: 1; min-width: 0; }
.fieldrow .field.wide { flex: 2; min-width: 0; }
.toggles { display: flex; margin-top: 2px; }
.toggle {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px 14px 6px 7px;
  margin-right: 10px;
  font-size: 12.5px;
  color: var(--muted);
  cursor: pointer;
}
.toggle:hover { background: var(--card-hover); }
.toggle .box {
  width: 16px; height: 16px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: #161A22;
  margin-right: 8px;
  flex: none;
}
.toggle.on { color: var(--text); border-color: rgba(61,220,132,0.40); }
.toggle.on .box { background: var(--accent); border-color: var(--accent); }
.muted-note { margin-top: 12px; font-size: 12px; color: var(--muted); }
.qmark { color: var(--muted); cursor: pointer; }

/* "Starting..." / "Stopping..." placeholders in the lifecycle group */
button:disabled { opacity: 0.55; cursor: default; }
button:disabled:hover { background: transparent; border-color: var(--line); }
/* thin vertical separator between lifecycle and config buttons */
.actions .sep { display: inline-block; width: 1px; height: 22px; background: var(--line); margin: 0 12px 0 4px; }

/* ---------- server configurator ---------- */
.cfgbar { display: flex; align-items: center; margin: 14px 0 4px 0; }
.cfgbar .grow { flex: 1; }
.cfgbar input {
  width: 260px;
  height: 34px;
  line-height: 20px;  /* Sciter: fixed-height inputs NEED an explicit line-height,
                         or text + caret drift vertically (see .field input) */
  box-sizing: border-box;
  background: #161A22;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  caret-color: #3DDC84;
  padding: 6px 10px;
  font-size: 13px;
  font-family: "Segoe UI", system-ui, sans-serif;
  margin-right: 10px;
}
.cfgbar input:focus { border-color: var(--accent); }
/* "Only set" in the bar: the launch-option toggle widget, tightened to bar height */
.cfgbar .toggle { flex: none; margin: 0 0 0 10px; padding: 5px 12px 5px 7px; }
/* collapse/expand all + the per-category fold (state in cfgState.collapsed) */
.cfgfold { font-size: 11.5px; color: var(--accent); cursor: pointer; }
.cfgfold:hover { text-decoration: underline; }
.cfgfoldsep { color: var(--muted); margin: 0 6px; font-size: 11.5px; }
.cfgcount { margin-left: 14px; }
.cfgcat { cursor: pointer; }
.cfgcat:hover { color: var(--text); }
.cfgcat .caret { display: inline-block; width: 14px; color: var(--muted); }
/* inline-block: Sciter drops the margin on a plain inline span, so the count
   rendered glued to the name ("GENERAL21") */
.cfgcat .n { display: inline-block; margin-left: 10px; color: var(--muted); font-weight: normal; letter-spacing: 0; }
.cfggroup.folded { display: none; }
/* dark select: style select AND option (Sciter popup list takes the option colors) */
select.cfgsel {
  height: 34px;
  line-height: 20px;
  box-sizing: border-box;
  background: #161A22;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  padding: 6px 10px;
  font-size: 12.5px;
  font-family: "Segoe UI", system-ui, sans-serif;
}
select.cfgsel option { background: #161A22; color: var(--text); }
.cfgcount { font-size: 12px; color: var(--muted); }

.cfgcat { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin: 18px 2px 8px 2px; }
.cfggroup { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cfgrow {
  display: flex;
  align-items: center;
  padding: 9px 14px 9px 11px;
  border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent;   /* accent when the key is set in the ini */
}
.cfgrow:last-child { border-bottom: none; }

}

function el(html) {
  // No <template> element in Sciter - use a plain container.
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  const c = d.firstElementChild;
  d.removeChild(c);
  return c;
}

// Escape a value for use inside an HTML attribute (input values may contain quotes).
const escAttr = v => String(v === undefined || v === null ? "" : v)
  .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

/* ---------- live server status (supervisor) ---------- */

// Status key: native rows carry the DB id; stub rows fall back to the array index.
const sid = (s, i) => (s && s.id !== undefined && s.id !== null) ? s.id : i;

const lastStatus = {};   // serverId -> latest {id,state,desired,pid,failures,detail}
let statusTimer = null;  // interval guard: the 2s poll is started exactly once

function dotClass(st) {
  if (!st) return "grey";
  if (st.state === "running") return "green";
  if (st.state === "starting" || st.state === "stopping") return "amber";
  if (st.state === "crashed" || st.state === "failed") return "red";
  return "grey";  // stopped / unknown
}
function dotClasses(st) {
  const c = dotClass(st);
  return "dot " + c + (c === "amber" ? " pulse" : "");
}
const stateNames = { stopped: "Stopped", starting: "Starting", running: "Running",
                     stopping: "Stopping", crashed: "Crashed", failed: "Failed" };
function stateSub(st) {
  if (!st) return "no status yet";
  if (st.state === "running") return st.pid ? "PID " + st.pid : "process up";
  if (st.detail) return st.detail;
  if ((st.state === "crashed" || st.state === "failed") && st.failures)
    return st.failures + " failed restart" + (st.failures === 1 ? "" : "s");
  if (st.state === "starting") return "waiting for process";
  if (st.state === "stopping") return "graceful shutdown";
  return "not running";
}

// Browser-preview stub: fake supervisor with timed transitions
// (starting -> running after ~3s, stopping -> stopped; restart chains through both).
const STUB_STATUS = {};  // id -> mutable stub state, seeded from the old "online" flag
function stubStat(id, i) {
  if (!STUB_STATUS[id]) {
    const on = !!(servers[i] && servers[i].online);
    STUB_STATUS[id] = { id, state: on ? "running" : "stopped", desired: on ? "running" : "stopped",
                        pid: on ? 4000 + i : 0, failures: 0, detail: "", _t: 0 };
  }
  return STUB_STATUS[id];
}
function stubStatuses() {
  const now = Date.now();
  servers.forEach((s, i) => {
    const st = stubStat(sid(s, i), i);
    if (st.state === "starting" && now - st._t > 3000) {
      st.state = "running"; st.pid = 4000 + i;
    } else if (st.state === "stopping" && now - st._t > 3000) {
      st.pid = 0;
      if (st.desired === "running") { st.state = "starting"; st._t = now; }  // restart flow
      else st.state = "stopped";
    }
  });
  return Object.values(STUB_STATUS).map(st => ({ id: st.id, state: st.state, desired: st.desired,
                                                 pid: st.pid, failures: st.failures, detail: st.detail }));
}

function pollStatuses() {
  let arr = null;
  if (NATIVE) {
    try { arr = JSON.parse(NATIVE.getStatuses()); } catch (e) { console.log("getStatuses failed: " + e); }
  } else {
    arr = stubStatuses();
  }
  if (!arr) return;
  for (const st of arr) lastStatus[st.id] = st;
  paintSidebarDots();
  if (screen === "server") paintStatusCard();
}
function startStatusPolling() {
  if (statusTimer) return;  // never stack intervals
  statusTimer = setInterval(pollStatuses, 2000);
}

// --- Workshop metadata backfill ---------------------------------------------
// A mod that only ever appeared in ActiveMods= was never looked up on the
// Workshop, so it had no name, no date and no thumbnail. The native side
// scrapes the gaps in the background and caches each preview image on disk; we
// poll until it reports done and repaint whenever rows actually land.
let modMetaTimer = null;
// What the Mods screen paints its loading state from: rows without a cached
// image show a pulsing placeholder while `running`, instead of the images just
// appearing out of nowhere a few seconds later.
let modMetaInfo = { running: false, total: 0, done: 0 };
function stopModMetaPoll() {
  if (modMetaTimer) { clearInterval(modMetaTimer); modMetaTimer = null; }
  modMetaInfo = { running: false, total: 0, done: 0 };
  paintModMetaChip();
}
// Repaint just the chip - the poll ticks every 1.5s and must not rebuild the DOM.
function paintModMetaChip() {
  const c = $("#modmeta");
  if (!c) return;
  const on = !!modMetaInfo.running;
  c.classList.toggle("on", on);
  if (!on) return;
  const n = modMetaInfo.total;
  $(".txt", c).textContent =
    "Loading Workshop info" + (n ? " " + (modMetaInfo.done + 1) + "/" + n : "") + "...";
}
function applyModMeta(json) {
  let st = null;
  try { st = JSON.parse(json); } catch (e) { console.log("modMeta parse failed: " + e); }
  if (!st) { stopModMetaPoll(); return; }
  modMetaInfo = { running: !!st.running, total: st.total || 0, done: st.done || 0 };
  paintModMetaChip();
  if (st.applied > 0) {
    for (const s of servers) s.mods = null;  // drop the cached list -> re-read
    // setTimeout, because this is also reached from inside renderMods (the
    // kickoff call): re-entering render() there would tear down the DOM that
    // call is still building.
    setTimeout(() => { if (screen === "mods") render(); }, 0);
  }
  if (!st.running) stopModMetaPoll();
}
function startModMetaRefresh(serverId) {
  if (!NATIVE || serverId === undefined || serverId === null) return;
  try { applyModMeta(NATIVE.refreshModMeta(serverId)); }
  catch (e) { console.log("refreshModMeta failed: " + e); return; }
  if (modMetaTimer) return;
  modMetaTimer = setInterval(() => {
    try { applyModMeta(NATIVE.getModMetaStatus()); }
    catch (e) { console.log("getModMetaStatus failed: " + e); stopModMetaPoll(); }
  }, 1500);
}

// The native side hands back a file:// URL into the local preview cache; the
// browser-preview stubs still carry https ones. Anything else is not an image.
function isPreviewUrl(u) {
  const s = String(u || "");
  return s.indexOf("file://") === 0 || s.indexOf("https://") === 0 ||
         s.indexOf("http://") === 0;
}

// Repaint only the sidebar dots in place (no DOM rebuild every 2s).
function paintSidebarDots() {
  const rows = $("#servers").children;
  for (let i = 0; i < rows.length && i < servers.length; i++) {
    const dot = $(".dot", rows[i]);
    if (dot) dot.className = dotClasses(lastStatus[sid(servers[i], i)]);
  }
}
function paintStatusCard() {
  const card = $("#statuscard");
  if (!card || !servers[cur]) return;
  const st = lastStatus[sid(servers[cur], cur)];
  card.innerHTML = `<div class="${dotClasses(st)}"></div>
      <div class="scol"><div class="slabel">${st ? (stateNames[st.state] || st.state) : "Unknown"}</div>
      <div class="ssub">${stateSub(st)}</div></div>`;
  paintLifecycle(false);
}

// Which lifecycle buttons make sense follows the LIVE state - a Restart on a
// stopped server or a Start on a running one is just noise:
//   stopped / crashed / failed / unknown -> [Start]
//   running                              -> [Stop] [Restart]
//   starting                             -> [Stop] + "Starting..." (disabled)
//   stopping                             -> "Stopping..." (disabled)
// Repainted only when the state actually changes, because paintStatusCard runs
// on the 2s poll and rebuilding buttons under the mouse would eat clicks.
let lifecycleState = null;
function paintLifecycle(force, boxOpt) {
  const box = boxOpt || $("#lifecycle");
  if (!box || !servers[cur]) return;
  const st = lastStatus[sid(servers[cur], cur)];
  const state = st ? st.state : "unknown";
  if (!force && state === lifecycleState) return;
  lifecycleState = state;
  const s = servers[cur];
  let html;
  if (state === "running")
    html = `<button class="b-stop">Stop</button><button class="b-restart">Restart</button>`;
  else if (state === "starting")
    html = `<button class="b-stop">Stop</button><button disabled>Starting...</button>`;
  else if (state === "stopping")
    html = `<button disabled>Stopping...</button>`;
  else
    html = `<button class="primary b-start">Start</button>`;
  box.innerHTML = html;
  const bs = $(".b-start", box);
  if (bs) bs.addEventListener("click", () => doServerAction(s, cur, "start"));
  const bp = $(".b-stop", box);
  if (bp) bp.addEventListener("click", () => doServerAction(s, cur, "stop"));
  const br = $(".b-restart", box);
  if (br) br.addEventListener("click", () => doServerAction(s, cur, "restart"));
}

// Start/Stop/Restart: fire-and-forget native call (the supervisor only flips
// desired-state), optimistic local repaint, then the 2s poll takes over.
function doServerAction(s, i, what) {
  const id = sid(s, i);
  if (NATIVE) {
    try {
      if (what === "start") NATIVE.startServer(s.id);
      else if (what === "stop") NATIVE.stopServer(s.id);
      else NATIVE.restartServer(s.id);
    } catch (e) { console.log(what + " failed: " + e); }
  } else {
    const st = stubStat(id, i);
    st._t = Date.now();
    if (what === "start") { st.state = "starting"; st.desired = "running"; }
    else if (what === "stop") { if (st.state !== "stopped") st.state = "stopping"; st.desired = "stopped"; }
    else { st.state = (st.state === "stopped") ? "starting" : "stopping"; st.desired = "running"; }
  }
  const prev = lastStatus[id] || { id, pid: 0, failures: 0, detail: "" };
  const opt = Object.assign({}, prev);
  if (what === "start") { opt.state = "starting"; opt.desired = "running"; }
  else if (what === "stop") { opt.state = "stopping"; opt.desired = "stopped"; }
  else { opt.state = "stopping"; opt.desired = "running"; }
  lastStatus[id] = opt;
  paintSidebarDots();
  paintStatusCard();
}

/* ---------- mod update run (orchestrator) ---------- */

let updTimer = null;   // 1s status poll, alive only while the update screen is shown
let updTarget = null;  // { serverId, note } of the run the screen was opened for

// Browser-preview stub: a time-scripted fake update run so the screen is fully
// previewable (collect -> download w/ lines -> 5s countdown -> install -> done).
let STUB_UPD = null;   // { t0, ids } - everything else derives from elapsed time
function stubStartUpdate(serverId, onlyModIds) {
  const only = onlyModIds ? String(onlyModIds).split(",") : [];  // same comma list as native
  if (STUB_UPD && stubUpdStatus().running) return false;
  const ids = [];
  servers.forEach((sv, i) => {
    if (serverId !== -1 && sid(sv, i) !== serverId) return;
    (sv.mods || []).forEach(m => {
      if ((only.length === 0 || only.indexOf(m.id) >= 0) && ids.indexOf(m.id) < 0) ids.push(m.id);
    });
  });
  STUB_UPD = { t0: Date.now(), ids };
  return true;
}
// Stub timeline (seconds): 0-1 collect, then 1s download per mod, 5s countdown,
// 1s install per mod, done. Lines accumulate along the walked timeline.
function stubUpdStatus() {
  if (!STUB_UPD) return { running: false, phase: "idle", countdownSecs: -1, mods: [], lines: [] };
  const u = STUB_UPD;
  const t = (Date.now() - u.t0) / 1000;
  const n = u.ids.length;
  const dl0 = 1, cd0 = dl0 + n, in0 = cd0 + 5, done0 = in0 + n;
  const lines = ["Collecting active mods..."];
  const mods = u.ids.map(id => ({ id, status: "Waiting" }));
  let phase = "collect", countdownSecs = -1, running = true;
  if (t >= dl0) {
    phase = "download";
    lines.push(n + " mod" + (n === 1 ? "" : "s") + " queued for steamcmd");
    u.ids.forEach((id, i) => {
      const dt = t - dl0 - i;
      if (dt >= 0) { mods[i].status = "Downloading..."; lines.push("Downloading item " + id + " ..."); }
      if (dt >= 1) { mods[i].status = "Downloaded"; lines.push("Success. Downloaded item " + id); }
    });
  }
  if (t >= cd0) {
    phase = "countdown";
    countdownSecs = Math.ceil(in0 - t);
    lines.push("Broadcast: server restarts for a mod update");
  }
  if (t >= in0) {
    phase = "install";
    countdownSecs = -1;
    lines.push("Saving world + stopping server...");
    u.ids.forEach((id, i) => {
      const dt = t - in0 - i;
      if (dt >= 0) { mods[i].status = "Installing..."; lines.push("Installing mod " + id + " ..."); }
      if (dt >= 1) { mods[i].status = "Updated"; lines.push("Updated mod " + id); }
    });
  }
  if (t >= done0) {
    phase = "done";
    running = false;
    lines.push("Restarting server...");
    lines.push("Update run finished.");
  }
  return { running, phase, countdownSecs, mods, lines };
}
function stubSkipCountdown() {
  if (!STUB_UPD) return false;
  const n = STUB_UPD.ids.length;
  const cd0 = 1 + n, in0 = cd0 + 5;
  const t = (Date.now() - STUB_UPD.t0) / 1000;
  if (t >= cd0 && t < in0) STUB_UPD.t0 -= (in0 - t) * 1000;  // jump past the countdown
  return true;
}

function loadUpdateStatus() {
  if (NATIVE) {
    try { return JSON.parse(NATIVE.getUpdateStatus()); }
    catch (e) { console.log("getUpdateStatus failed: " + e); }
    return { running: false, phase: "error", countdownSecs: -1, mods: [], lines: [] };
  }
  return stubUpdStatus();
}

// Kick off a run and switch to the update screen. A false return from
// startUpdate means a run is already in progress - the screen then simply
// shows that running run, with an inline note.
// onlyModIds: "" = all active mods, else a comma list. force: reinstall even
// when steamcmd reports the mod up to date (the "Reinstall" button).
function startUpdateRun(serverId, onlyModIds, force) {
  let ok = false;
  if (NATIVE) {
    try { ok = NATIVE.startUpdate(serverId, onlyModIds, !!force); }
    catch (e) { console.log("startUpdate failed: " + e); }
  } else {
    ok = stubStartUpdate(serverId, onlyModIds);
  }
  updTarget = { serverId, note: ok ? "" : "An update is already running - showing the running update." };
  screen = "update";
  render();
}

function startUpdPolling() {
  if (updTimer) return;  // never stack intervals
  updTimer = setInterval(paintUpdate, 1000);
}
function stopUpdPolling() {
  if (updTimer) { clearInterval(updTimer); updTimer = null; }
}

const updPhaseNames = { idle: "Idle", collect: "Collecting mods", download: "Downloading",
                        install: "Installing", countdown: "Restart countdown",
                        done: "Done", error: "Error" };
function fmtMMSS(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
// Row color from the ModProgress status text (see orchestrator.h):
// Updated/Installed = accent, Error*/Removed* = danger, Up to date = muted.
function updModColor(status) {
  const s = String(status).toLowerCase();
  if (s.indexOf("error") === 0 || s.indexOf("removed") === 0) return "var(--danger)";
  if (s === "updated" || s === "installed") return "var(--accent)";
  if (s === "up to date") return "var(--muted)";
  return "var(--text)";
}

// Repaint the update screen in place (no DOM rebuild every second).
function paintUpdate() {
  const bar = $(".updbar");
  if (!bar) { stopUpdPolling(); return; }  // screen gone - defensive
  const st = loadUpdateStatus();

  const ph = $(".u-phase", bar);
  ph.textContent = updPhaseNames[st.phase] || st.phase || "";
  // badge coloring: error -> red, done -> green, running phases -> neutral
  ph.className = "updphase u-phase pill " +
      (st.phase === "error" ? "rem" : st.phase === "done" ? "ok" : "no");
  const cd = (st.countdownSecs !== undefined && st.countdownSecs !== null) ? st.countdownSecs : -1;
  const cnt = $(".u-count", bar);
  cnt.style.display = cd >= 0 ? "block" : "none";
  if (cd >= 0) cnt.textContent = fmtMMSS(cd);
  $(".u-skip", bar).style.display = cd >= 0 ? "inline-block" : "none";
  $(".u-back", bar).style.display = st.running ? "none" : "inline-block";

  // console (newest LAST): only touch the DOM when the text changed, then pin to bottom
  const box = $("#updbox");
  const txt = (st.lines || []).join("\n");
  if (box && box._txt !== txt) {
    box._txt = txt;
    box.textContent = txt;  // textContent: no HTML injection from steamcmd output
    box.scrollTop = box.scrollHeight;
  }

  // per-mod status strip
  const strip = $("#updmods");
  const key = (st.mods || []).map(m => m.id + "=" + m.status).join(";");
  if (strip && strip._key !== key) {
    strip._key = key;
    strip.innerHTML = "";
    (st.mods || []).forEach(m => {
      const r = el(`<div class="updrow"><div class="uid">${m.id}</div><div class="ust"></div></div>`);
      const u = $(".ust", r);
      u.textContent = m.status;
      u.style.color = updModColor(m.status);
      strip.appendChild(r);
    });
    if (!(st.mods || []).length)
      strip.appendChild(el(`<div class="updrow" style="color:#93A0AE">No mods in this run yet.</div>`));
  }

  if (!st.running) stopUpdPolling();  // done/error: last paint stays, Back is visible
  return st;
}

function renderUpdate(host) {
  let name = "All servers";
  if (updTarget && updTarget.serverId !== -1) {
    const sv = servers.find((x, i) => sid(x, i) === updTarget.serverId);
    if (sv) name = sv.name;
  }
  host.appendChild(el(`<div class="crumb">Updating: <b>${name}</b></div>`));
  if (updTarget && updTarget.note)
    host.appendChild(el(`<div class="updnote">${updTarget.note}</div>`));

  const bar = el(`<div class="updbar">
      <div class="updphase u-phase"></div>
      <div class="updcount u-count" style="display:none"></div>
      <button class="u-skip" style="display:none">Skip Countdown</button>
      <div class="grow"></div>
      <button class="u-back" style="display:none">Back</button></div>`);
  $(".u-skip", bar).addEventListener("click", () => {
    if (NATIVE) {
      try { NATIVE.skipUpdateCountdown(); } catch (e) { console.log("skipUpdateCountdown failed: " + e); }
    } else {
      stubSkipCountdown();
    }
    paintUpdate();  // reflect the skip right away, not at the next tick
  });
  $(".u-back", bar).addEventListener("click", () => {
    stopUpdPolling();
    if (NATIVE) servers = loadServers();  // fresh rows, mods=null -> statuses refetch
    screen = "mods";
    render();
  });
  host.appendChild(bar);
  host.appendChild(el(`<div id="updbox"></div>`));
  host.appendChild(el(`<div id="updmods"></div>`));

  const st = paintUpdate();
  if (st && st.running) startUpdPolling();
}

function renderSidebar() {
  const host = $("#servers");
  host.innerHTML = "";
  // On the system screens (logs/add-server/settings) no server row is active.
  const sysScreen = (screen === "logs" || screen === "addserver" || screen === "settings");
  servers.forEach((s, i) => {
    const active = !sysScreen && cur === i;
    const count = (s.modCount !== undefined) ? s.modCount : (s.mods ? s.mods.length : 0);
    const n = el(`<div class="nav ${active ? "active" : ""}">
        <div class="${dotClasses(lastStatus[sid(s, i)])}"></div><div class="nname">${s.name}</div>
        <div class="badge">${count}</div></div>`);
    n.addEventListener("click", () => { cur = i; screen = "server"; selMod = 0; render(); });
    host.appendChild(n);
  });
  $("#navlogs").classList.toggle("active", screen === "logs");
  $("#addserver").classList.toggle("active", screen === "addserver");
  $("#navsettings").classList.toggle("active", screen === "settings");
}

function renderMods(host) {
  const s = servers[cur];
  const list = ensureMods(s);
  if (selMod >= list.length) selMod = 0;
  const crumb = el(`<div class="crumb">Mods from: <b class="cw"></b>
      <span id="modmeta" class="loadchip"><span class="dot"></span><span class="txt"></span></span></div>`);
  $(".cw", crumb).textContent = s.name;  // server names are user-entered
  host.appendChild(crumb);

  const wrap = el(`<div id="modswrap"></div>`);
  const table = el(`<div id="modtable"></div>`);
  table.appendChild(el(`<div class="thead"><div class="c-thumb"></div><div class="c-id">ID</div>
      <div class="c-status">Status</div><div class="c-name">Name</div></div>`));
  list.forEach((m, i) => {
    // Real workshop mini-thumbnail when a preview image is cached; otherwise a
    // grey box - pulsing while the Workshop lookup for this list is still out.
    const thumb = isPreviewUrl(m.preview)
      ? `<img class="tmb" src="${escAttr(m.preview)}">`
      : `<div class="box ${modMetaInfo.running ? "loading" : ""}"></div>`;
    const r = el(`<div class="trow ${i === selMod ? "sel" : ""} ${m.state === "rem" ? "removedrow" : ""}">
        <div class="c-thumb">${thumb}</div><div class="c-id"></div>
        <div class="c-status"><span class="pill ${m.state}">${stateLabel[m.state]}</span></div>
        <div class="c-name"></div></div>`);
    // textContent, not interpolation: the mod NAME is scraped from the Workshop
    // page and the ID comes from a hand-editable ActiveMods= line - neither may
    // reach innerHTML (same rule as the log/steamcmd output elsewhere).
    $(".c-id", r).textContent = m.id;
    $(".c-name", r).textContent = m.name;
    const im = $(".tmb", r);
    if (im) im.addEventListener("error", () => { im.parentNode.innerHTML = '<div class="box"></div>'; });
    r.addEventListener("click", () => { selMod = i; render(); });
    table.appendChild(r);
    if (stateTip[m.state]) attachTip($(".pill", r), stateTip[m.state]);
  });
  if (!list.length) {
    table.appendChild(el(`<div class="trow" style="cursor:default;color:#93A0AE">
        <div class="c-thumb"></div><div style="padding:6px 0">No active mods on this server.</div></div>`));
  }
  wrap.appendChild(table);

  if (list.length) {
    const m = list[selMod];
    const pv = el(`<div id="preview">
        <div class="img ${modMetaInfo.running ? "loading" : ""}">${
          modMetaInfo.running ? "loading preview..." : "no preview yet"}</div>
        <h3></h3><div class="id"></div>
        <div class="kv"><div class="k">Status</div><span class="pill ${m.state}">${stateLabel[m.state]}</span></div>
        <div class="kv"><div class="k">Size</div><span class="v-size"></span></div>
        <div class="kv kv-rel"><div class="k">Released</div><span class="v-rel"></span></div>
        <div class="kv kv-upd"><div class="k">Updated</div><span class="v-upd"></span></div>
        <div class="kv kv-inst"><div class="k">Installed</div><span class="v-inst"></span></div>
        <div style="margin-top:10px"><a class="ws">View on Workshop</a></div></div>`);
    // Same rule as above - every one of these comes from the Workshop or the ini.
    $("h3", pv).textContent = m.name;
    $(".id", pv).textContent = "ID " + m.id;
    $(".v-size", pv).textContent = m.size;
    $(".v-rel", pv).textContent = m.released || "-";
    $(".v-upd", pv).textContent = m.updated;
    $(".v-inst", pv).textContent = m.installedAt || "-";
    attachTip($(".kv-rel", pv), "First published on the Steam Workshop (the Workshop's \"Posted\" date).");
    attachTip($(".kv-upd", pv), "Last update the author pushed to the Workshop.");
    attachTip($(".kv-inst", pv), "When AMU last installed or updated this mod on THIS server (local time).");
    $(".ws", pv).addEventListener("click", () => openExternal(URL_WS + m.id));
    if (stateTip[m.state]) attachTip($(".pill", pv), stateTip[m.state]);
    // Workshop preview image: only for http(s) URLs; on a load error swap back
    // to the "no preview" text (Sciter fires an error event on img like browsers).
    const purl = String(m.preview || "");
    if (isPreviewUrl(purl)) {
      const imgBox = $(".img", pv);
      const img = el(`<img src="${escAttr(purl)}" style="width:100%;height:130px;border-radius:8px">`);
      img.addEventListener("error", () => { imgBox.innerHTML = ""; imgBox.textContent = "no preview yet"; });
      imgBox.textContent = "";
      imgBox.appendChild(img);
    }
    wrap.appendChild(pv);
  } else {
    wrap.appendChild(el(`<div id="preview"><div class="img">no preview</div>
        <h3>No mods</h3><div class="id">Set ActiveMods in GameUserSettings.ini or add one below.</div></div>`));
  }
  host.appendChild(wrap);

  // Inline Add-Mod row (hidden until "Add Mod" is clicked), above the actions.
  const addrow = el(`<div class="actions addmodrow" style="display:none">
      <input|text class="am-id" placeholder="Workshop mod id">
      <button class="primary am-ok">Add</button>
      <button class="am-cancel">Cancel</button>
      <a class="am-browse">Browse the Workshop</a>
      <span class="am-note"></span></div>`);
  $(".am-browse", addrow).addEventListener("click", () => openExternal(URL_WS_BROWSE));
  const idInp = $(".am-id", addrow);
  const note = $(".am-note", addrow);
  idInp.addEventListener("input", () => {
    // digits only (Workshop ids are numeric)
    const v = String(idInp.value !== undefined && idInp.value !== null ? idInp.value : "");
    let out = "";
    for (let i = 0; i < v.length; i++) if (v[i] >= "0" && v[i] <= "9") out += v[i];
    if (out !== v) idInp.value = out;
  });
  $(".am-cancel", addrow).addEventListener("click", () => {
    addrow.style.display = "none";
    idInp.value = "";
    note.textContent = "";
  });
  $(".am-ok", addrow).addEventListener("click", () => {
    const id = String(idInp.value !== undefined && idInp.value !== null ? idInp.value : "").trim();
    if (!id) { note.textContent = "Enter a Workshop mod id."; return; }
    let res = null;
    if (NATIVE) {
      try { res = JSON.parse(NATIVE.addMod(s.id, id)); }
      catch (e) { console.log("addMod failed: " + e); note.textContent = "Add failed - see logs."; return; }
    } else {
      // stub: mutate the stub mod array so the preview works
      if (list.some(m => m.id === id)) {
        res = { ok: false, already: true, name: "", available: true };
      } else {
        list.push({ id, name: "Mod " + id, state: "no", size: "-", updated: "-" });
        res = { ok: true, already: false, name: "Mod " + id, available: true };
      }
    }
    if (res.already) { note.textContent = "Mod " + id + " is already active on this server."; return; }
    if (!res.ok) { note.textContent = "Could not add mod " + id + "."; return; }
    if (NATIVE) { s.mods = null; servers = loadServers(); }  // refetch list + sidebar count
    render();
  });
  host.appendChild(addrow);

  // The button set follows the list, not a fixed layout:
  //  - "Install missing (N)"  only while some mod is not (fully) on disk; runs
  //                           the pipeline for exactly those ids.
  //  - "Check for updates"    always (when there are mods): steamcmd validates
  //                           every active mod - outdated ones get updated,
  //                           current ones are reported "Up to date" and left
  //                           alone. It is the ONLY way to learn that an
  //                           installed mod is outdated, which is why it stays
  //                           even when everything is installed (it becomes
  //                           the primary button then).
  //  - per selection          "Install" for a missing mod, "Reinstall" (force)
  //                           for an installed one - "Update" would be wrong
  //                           for something already current.
  //  - "Remove Mod"           danger-styled, only with a selection.
  const missing = list.filter(m => m.state === "no" || m.state === "inc");
  const sel = list[selMod];
  const selMissing = !!sel && (sel.state === "no" || sel.state === "inc");
  let btns = "";
  if (list.length) {
    if (missing.length)
      btns += `<button class="primary b-instmissing">Install missing (${missing.length})</button>`;
    btns += `<button class="${missing.length ? "" : "primary"} b-checkall">Check for updates</button>`;
    if (sel) btns += `<button class="b-selact">${selMissing ? "Install" : "Reinstall"}</button>`;
  }
  btns += `<button class="b-addmod">Add Mod</button>`;
  if (sel) btns += `<button class="danger b-remmod">Remove Mod</button>`;
  const act = el(`<div class="actions">${btns}</div>`);

  const bim = $(".b-instmissing", act);
  if (bim) {
    attachTip(bim, "Download and install only the mods that are not (fully) on disk yet.");
    bim.addEventListener("click", () => startUpdateRun(s.id, missing.map(m => m.id).join(","), false));
  }
  const bca = $(".b-checkall", act);
  if (bca) {
    attachTip(bca, "Let steamcmd validate every active mod: outdated ones are updated, missing ones installed, current ones left untouched.");
    bca.addEventListener("click", () => startUpdateRun(s.id, "", false));
  }
  const bsa = $(".b-selact", act);
  if (bsa) {
    attachTip(bsa, selMissing ? "Download and install the selected mod."
                              : "Re-download and reinstall the selected mod even though it is already up to date.");
    bsa.addEventListener("click", () => {
      const m = list[selMod];
      if (m) startUpdateRun(s.id, m.id, m.state === "ok");
    });
  }
  $(".b-addmod", act).addEventListener("click", () => {
    addrow.style.display = (addrow.style.display === "none") ? "block" : "none";
    note.textContent = "";
  });
  // Remove asks through the confirm modal and spells out what happens.
  const rb = $(".b-remmod", act);  // absent when nothing is selected
  if (rb) rb.addEventListener("click", () => {
    const m = list[selMod];
    if (!m) return;
    askConfirm({
      title: "Remove mod from " + s.name + "?",
      text: m.name + " (ID " + m.id + ") will be:\n" +
            "- taken out of ActiveMods= in GameUserSettings.ini\n" +
            "- deleted from ShooterGame\\Content\\Mods on disk\n\n" +
            "The Workshop item is not affected - you can add it again any time.",
      okLabel: "Remove mod",
      danger: true,
      onOk: () => {
        if (NATIVE) {
          try { NATIVE.removeMod(s.id, m.id); } catch (e) { console.log("removeMod failed: " + e); }
          s.mods = null;
          servers = loadServers();
        } else {
          const i = list.indexOf(m);
          if (i >= 0) list.splice(i, 1);
        }
        selMod = 0;
        render();
      },
    });
  });
  host.appendChild(act);

  // Last: fill in whatever Workshop metadata is still missing (names, dates,
  // preview images) in the background and repaint when it lands.
  startModMetaRefresh(s.id);
}

// ASE/ASA pill pair: returns a curGame() getter; onChange fires after a switch.
function wireGamePills(gp, onChange) {
  const pick = (i) => {
    gp.children[i].classList.add("active");
    gp.children[1 - i].classList.remove("active");
    if (onChange) onChange();
  };
  gp.children[0].addEventListener("click", () => pick(0));
  gp.children[1].addEventListener("click", () => pick(1));
  attachTip(gp.children[0],
    "ARK: Survival Evolved - the classic ARK (2015).\n" +
    "Server exe: ShooterGameServer.exe - mods from the Steam Workshop " +
    "(AMU installs and updates them via SteamCMD).");
  attachTip(gp.children[1],
    "ARK: Survival Ascended - the Unreal Engine 5 remake (2023).\n" +
    "Server exe: ArkAscendedServer.exe - maps use the _WP suffix; mods come " +
    "from CurseForge (AMU mod updates currently cover ASE only).");
  return () => (gp.children[1].classList.contains("active") ? "ASA" : "ASE");
}

// Map combobox on a .combo element: suggestions from ARK_MAPS[curGame()], free
// text stays allowed (mod/custom maps). The caret shows the full list, typing
// filters it live. Returns { input, list, fill } so callers can refilter.
function wireMapCombo(combo, curGame) {
  // Sciter: <input|text> IS an <input>. A plain browser parses it as a literal
  // "input|text" element instead, so fall back to a tag-prefix scan there -
  // without it the first render() throws and the whole preview dies.
  let input = $("input", combo);
  if (!input)
    for (const n of combo.querySelectorAll("*"))
      if (String(n.tagName).toLowerCase().indexOf("input") === 0) { input = n; break; }
  const list = $(".combolist", combo);
  const fill = (filter) => {
    const f = (filter || "").toLowerCase();
    const maps = (ARK_MAPS[curGame()] || []).filter(
      m => !f || m.v.toLowerCase().includes(f) || m.n.toLowerCase().includes(f));
    list.innerHTML = "";
    if (!maps.length) {
      list.appendChild(el(`<div class="cempty">No matching official map - a custom/mod map name is fine.</div>`));
      return;
    }
    maps.forEach(m => {
      const o = el(`<div class="copt"><div>${m.v}</div><div class="cn">${m.n}</div></div>`);
      o.addEventListener("click", () => {
        input.value = m.v;
        list.style.display = "none";
        comboOpen = null;
      });
      list.appendChild(o);
    });
  };
  $(".caret", combo).addEventListener("click", () => {
    if (list.style.display === "none") {
      fill("");  // caret shows the full list, unfiltered
      list.style.display = "block";
      comboOpen = list;
    } else {
      list.style.display = "none";
      comboOpen = null;
    }
  });
  // Clicking the FIELD opens the full list too, not just the caret. The caret
  // glyph has proven unreliable to render in Sciter, so the combobox must be
  // fully usable without it - the whole control behaves like a dropdown.
  input.addEventListener("click", () => {
    if (list.style.display === "none") {
      fill("");
      list.style.display = "block";
      comboOpen = list;
    }
  });
  input.addEventListener("input", () => {
    // Typing filters the list live (and opens it on first keystroke).
    fill(String(input.value || ""));
    list.style.display = "block";
    comboOpen = list;
  });
  return { input, list, fill };
}

// "Browse..." next to a Path field: opens the native folder picker seeded with
// the current value. Cancelling returns "" and leaves the field untouched. In
// the plain-browser preview there is no picker, so the button just hints.
function wireBrowse(btn, input) {
  if (!btn || !input) return;
  btn.addEventListener("click", () => {
    if (!NATIVE) { btn.textContent = "(desktop only)"; return; }
    try {
      const p = NATIVE.pickFolder("Select the ARK install root", inpVal(input));
      if (p) input.value = p;
    } catch (e) { console.log("pickFolder failed: " + e); }
  });
}

// Input value with a browser-preview fallback: unknown <input|*> elements in a
// plain browser have no .value property, only the value attribute.
function inpVal(inp) {
  if (!inp) return "";
  return (inp.value !== undefined && inp.value !== null)
    ? String(inp.value) : (inp.getAttribute("value") || "");
}

      path: inpVal($(".a-path", form)).trim(),
      map: inpVal($(".a-map", form)).trim(),
      game: curGame(),
    };
    if (!obj.name || !obj.path) { showNote("Name and Path are required."); return; }

                            rconIp: "", rconPort: "", online: false, mods: [] });

      servers = loadServers();
      const idx = servers.findIndex((x, i) => sid(x, i) === res.id);
      cur = idx >= 0 ? idx : 0;
      selMod = 0;
      screen = "server";
      render();
      return;
    }
    // Errors do not block a retry - the form keeps its values.
    if (res.error === "exe-not-found")
      showNote("ShooterGameServer.exe / ArkAscendedServer.exe not found under " +
               obj.path + "\\ShooterGame\\Binaries\\Win64");
    else if (res.error === "duplicate")
      showNote("This path is already configured.");
    else
      showNote("Could not create the server" + (res.error ? ": " + res.error : "") + ".");
  });
  host.appendChild(act);
}

/* ---------- app update check (About row + startup banner) ---------- */

// Browser-preview stub: checkAppUpdate flips it to "checking", ~2s later the
// check "resolves" to an available fake 9.9.9 - so the whole cycle is previewable.
const STUB_UPDATECHECK = { state: "idle", current: "2.0.0-dev", latest: "", error: "", _t: 0 };
function stubCheckAppUpdate() {
  STUB_UPDATECHECK.state = "checking";
  STUB_UPDATECHECK._t = Date.now();
  return true;
}
function stubUpdateCheck() {
  const u = STUB_UPDATECHECK;
  if (u.state === "checking" && Date.now() - u._t > 2000) { u.state = "available"; u.latest = "9.9.9"; }
  return { state: u.state, current: u.current, latest: u.latest, error: u.error };
}

// Non-blocking snapshot of the background update check (states: idle | checking
// | uptodate | available | error; the check itself runs on a native thread).
function loadUpdateCheck() {
  if (NATIVE) {
    try { return JSON.parse(NATIVE.getUpdateCheck()); }
    catch (e) { console.log("getUpdateCheck failed: " + e); }
    return { state: "error", current: "", latest: "", error: "bindings unavailable" };
  }
  return stubUpdateCheck();
}
// Kick a re-check; the result arrives via getUpdateCheck polling.
function kickUpdateCheck() {
  if (NATIVE) {
    try { return !!NATIVE.checkAppUpdate(); }
    catch (e) { console.log("checkAppUpdate failed: " + e); }
    return false;
  }
  return stubCheckAppUpdate();
}
// Launch lib\amu_updater.exe - the app then closes itself. False = updater exe
// missing or no update available. The browser preview never launches anything.
function launchInstall() {
  if (NATIVE) {
    try { return !!NATIVE.installAppUpdate(); }
    catch (e) { console.log("installAppUpdate failed: " + e); }
    return false;
  }
  return true;
}
// Shared install-click flow: the restart note goes up first (the app closes
// moments later); the stub keeps an inline preview note instead of restarting.
function runInstall(setNote) {
  if (!NATIVE) {
    setNote("Updating - AMU will restart... (preview: updater not launched)", "var(--accent)");
    return;
  }
  setNote("Updating - AMU will restart...", "var(--accent)");
  if (!launchInstall()) setNote("Could not start the updater - see logs.", "var(--danger)");
}

// Dedicated 1s poll behind the About row; alive only while a check is in flight.
let aupdTimer = null;
function stopAupdPolling() { if (aupdTimer) { clearInterval(aupdTimer); aupdTimer = null; } }
function startAupdPolling() {
  if (aupdTimer) return;  // never stack intervals
  aupdTimer = setInterval(paintAppUpdate, 1000);
}
// Repaint the About update row in place; stops its own poll on a terminal state
// (and when the settings screen is gone - defensive, like paintUpdate).
function paintAppUpdate() {
  const line = $(".updline");
  if (!line) { stopAupdPolling(); return null; }
  const st = loadUpdateCheck();
  const status = $(".upd-status", line);
  let text = "", color = "var(--muted)", install = false;
  if (st.state === "checking") text = "Checking...";
  else if (st.state === "uptodate") text = "You are up to date.";
  else if (st.state === "available") {
    text = "Version " + st.latest + " available";
    color = "var(--accent)";
    install = true;
  } else if (st.state === "error") {
    text = "Update check failed" + (st.error ? ": " + st.error : "");
    color = "var(--danger)";
  }
  status.textContent = text;
  status.style.color = color;
  $(".upd-install", line).style.display = install ? "inline-block" : "none";
  if (st.state !== "checking") stopAupdPolling();  // terminal (or idle): poll ends
  return st;
}

// Startup notice: render() prepends the banner while updBannerLatest is set and
// it was not dismissed. Dismiss is remembered for the session only (a JS flag).
let updBannerLatest = "";
let updBannerDismissed = false;
function buildUpdBanner() {
  const b = el(`<div id="updbanner">
      <div class="btxt">Update <b class="bver"></b> available</div>
      <div class="grow"></div>
      <button class="primary b-install">Install</button>
      <div class="bx">x</div></div>`);
  $(".bver", b).textContent = updBannerLatest;  // textContent: no HTML from version.txt
  $(".b-install", b).addEventListener("click", () => {
    const txt = $(".btxt", b);
    runInstall((t, c) => { txt.textContent = t; txt.style.color = c; });
  });
  $(".bx", b).addEventListener("click", () => {
    updBannerDismissed = true;
    if (b.parentNode) b.parentNode.removeChild(b);
  });
  return b;
}
// One lightweight look ~3s after load (the native check starts at app launch);
// retries every 2s only while the check is still running, then stops for good.
function startupUpdatePoll(triesLeft) {
  const st = loadUpdateCheck();
  if (st.state === "available") {
    updBannerLatest = st.latest || "";
    if (updBannerLatest && !updBannerDismissed) render();
    return;
  }
  if ((st.state === "checking" || st.state === "idle") && triesLeft > 0)
    setTimeout(() => startupUpdatePoll(triesLeft - 1), 2000);
}
