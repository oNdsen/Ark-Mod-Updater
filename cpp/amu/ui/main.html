/* ---------- server configurator ---------- */

// Schema guard: config_schema.js is a plain <script>, so the global exists by the
// time this module runs; the fallback keeps the rest of the UI alive if it is missing.
const SCHEMA = (typeof CONFIG_SCHEMA !== "undefined") ? CONFIG_SCHEMA : { settings: [] };

// Per-server view state. Dumps reload when the server changes; the search +
// category filters intentionally survive across servers. Pending (staged)
// changes live in cfgPendingAll, keyed by server id, so they survive
// navigating away and back - each server keeps its own staged set.
const cfgState = {
  serverId: null,          // sid() of the server the dumps belong to
  dumps: null,             // { gus, game } raw ini dumps
  maps: null,              // { gus, game } "section|key" (lowercased) -> [values...]
  search: "",
  cat: "",
  onlySet: false,          // "Only set" filter: hide everything ARK is defaulting
  collapsed: {},           // category -> folded? (survives refreshes and server switches)
};
const cfgPendingAll = {};  // serverId -> { edits: {pendKey->{file,section,key,value}},
                           //               dels:  {pendKey->{file,section,key}},
                           //               fams:  {pendKey->{file,section,key,lines[]}} }
function cfgPend() {
  const id = cfgState.serverId;
  if (!cfgPendingAll[id]) cfgPendingAll[id] = { edits: {}, dels: {}, fams: {} };
  return cfgPendingAll[id];
}
let cfgRefresh = null;     // rebuilds the settings list; set by renderConfig

const parseBool = v => /^\s*(true|1)\s*$/i.test(String(v));
const cfgFileTag = st => st.file === "Game" ? "game" : "gus";
const cfgMapKey = st => st.section.toLowerCase() + "|" + st.key.toLowerCase();
const pendKey = st => cfgFileTag(st) + "|" + cfgMapKey(st);

function loadIniDump(s, tag) {
  if (NATIVE && s.id !== undefined && s.id !== null) {
    try { return JSON.parse(NATIVE.getIniDump(s.id, tag)); }
    catch (e) { console.log("getIniDump failed: " + e); }
    return { sections: [] };
  }
  // deep copy so staged stub edits only land in STUB_INI_* on Save
  return JSON.parse(JSON.stringify(tag === "gus" ? STUB_INI_GUS : STUB_INI_GAME));
}
function buildIniMap(dump) {
  const m = {};
  for (const sec of (dump.sections || [])) {
    const sname = String(sec.name || "").toLowerCase();
    for (const e of (sec.entries || [])) {
      const k = sname + "|" + String(e[0]).toLowerCase();
      if (!m[k]) m[k] = [];
      m[k].push(String(e[1]));
    }
  }
  return m;
}
function ensureCfgDumps(s) {
  const id = sid(s, cur);
  if (cfgState.serverId === id && cfgState.dumps) return;
  cfgState.serverId = id;
  // NOTE: pending state is NOT reset here - it lives per-server in cfgPendingAll.
  cfgState.dumps = { gus: loadIniDump(s, "gus"), game: loadIniDump(s, "game") };
  cfgState.maps = { gus: buildIniMap(cfgState.dumps.gus), game: buildIniMap(cfgState.dumps.game) };
}

// Values of this setting in its ini file (array: ARK repeats keys), or null.
function dumpValues(st) {
  const v = cfgState.maps[cfgFileTag(st)][cfgMapKey(st)];
  return (v && v.length) ? v : null;
}
// What the editor should show: staged edit > staged delete (= not set) > ini > not set.
function cfgDisplay(st) {
  const pk = pendKey(st), p = cfgPend();
  if (p.edits[pk]) return { val: p.edits[pk].value, set: true };
  if (p.dels[pk]) return { val: null, set: false };
  const v = dumpValues(st);
  return v ? { val: v[0], set: true } : { val: null, set: false };
}
// Family match: a line belongs to the setting when its key equals the setting
// key OR starts with it followed by "[" (indexed families like Key[0], Key[1]).
function isFamilyKey(k, key) {
  const s = String(k).toLowerCase(), w = key.toLowerCase();
  return s === w || s.indexOf(w + "[") === 0;
}
// Raw "Key=Value" lines of a setting's family in its ini file.
function cfgFamilyLines(st) {
  const out = [];
  const secWanted = st.section.toLowerCase();
  for (const sec of (cfgState.dumps[cfgFileTag(st)].sections || [])) {
    if (String(sec.name || "").toLowerCase() !== secWanted) continue;
    for (const e of sec.entries)
      if (isFamilyKey(e[0], st.key)) out.push(e[0] + "=" + e[1]);
  }
  return out;
}
// Raw lines for the complex/array display: the family; if nothing matches and
// the key equals the section name (e.g. ScalabilityGroups), the whole section.
function cfgRawLines(st) {
  const out = cfgFamilyLines(st);
  if (out.length) return out;
  const secWanted = st.section.toLowerCase();
  if (secWanted === st.key.toLowerCase())
    for (const sec of (cfgState.dumps[cfgFileTag(st)].sections || []))
      if (String(sec.name || "").toLowerCase() === secWanted)
        for (const e of sec.entries) out.push(e[0] + "=" + e[1]);
  return out;
}

// Are two values the same setting-wise? Bools compare parsed ("1" == "True"),
// everything else as trimmed strings.
function cfgValuesEqual(st, a, b) {
  if (st.type === "bool") return parseBool(a) === parseBool(b);
  return String(a).trim() === String(b).trim();
}
function stageEdit(st, value) {
  const pk = pendKey(st), p = cfgPend();
  delete p.dels[pk];   // editing a value cancels a staged delete
  // Reverting to the original state removes the pending change instead of
  // staging a no-op: back to the ini value (when set), or - for a not-set
  // bool - back to the schema default the toggle started on.
  const orig = dumpValues(st);
  const backToOrig = orig
    ? cfgValuesEqual(st, value, orig[0])
    : (st.type === "bool" && cfgValuesEqual(st, value, String(st.default || "")));
  if (backToOrig) {
    delete p.edits[pk];
  } else {
    p.edits[pk] = { file: cfgFileTag(st), section: st.section, key: st.key,
                    value: String(value) };
  }
  paintCfgFooter();
}
function unstageEdit(st) {
  delete cfgPend().edits[pendKey(st)];
  paintCfgFooter();
}
function stageDelete(st) {
  const pk = pendKey(st), p = cfgPend();
  delete p.edits[pk];
  p.dels[pk] = { file: cfgFileTag(st), section: st.section, key: st.key };
  paintCfgFooter();
}
// Stage a whole-family rewrite (complex/array settings); empty lines = removal.
// Re-applying exactly the original family lines un-stages the pending change.
function stageFamily(st, lines) {
  const pk = pendKey(st), p = cfgPend();
  if (lines.join("\n") === cfgFamilyLines(st).join("\n")) {
    delete p.fams[pk];
  } else {
    p.fams[pk] = { file: cfgFileTag(st), section: st.section, key: st.key, lines };
  }
  paintCfgFooter();
}

// Repaint one row's set-indicator in place (no list rebuild -> the input keeps focus).
function updCfgRow(elem, st) {
  const row = elem.closest(".cfgrow");
  if (!row) return;
  const pk = pendKey(st), p = cfgPend();
  let set;
  if (st.type === "array" || st.complex) {
    const fam = p.fams[pk];
    set = fam ? fam.lines.length > 0 : cfgFamilyLines(st).length > 0;
  } else {
    set = !!(p.edits[pk] || (dumpValues(st) && !p.dels[pk]));
  }
  row.classList.toggle("isset", set);
}

// Keep only digits (int) / digits + one dot (float), with an optional leading minus.
function sanNum(v, isFloat) {
  let out = "", dot = false;
  for (let i = 0; i < v.length; i++) {
    const c = v[i];
    if (c === "-" && out === "") out += c;
    else if (c >= "0" && c <= "9") out += c;
    else if (isFloat && c === "." && !dot) { out += c; dot = true; }
  }
  return out;
}
function onCfgNumInput(inp, st, isFloat) {
  let v = String(inp.value !== undefined && inp.value !== null ? inp.value : "");
  const sv = sanNum(v, isFloat);
  if (sv !== v) { inp.value = sv; v = sv; }
  const valid = isFloat ? /^-?(\d+(\.\d*)?|\.\d+)$/.test(v) : /^-?\d+$/.test(v);
  if (v === "") { unstageEdit(st); inp.classList.remove("invalid"); }
  else if (valid) { stageEdit(st, v); inp.classList.remove("invalid"); }
  else { unstageEdit(st); inp.classList.add("invalid"); }  // invalid: excluded from Save
  updCfgRow(inp, st);
}

// The greyed text in an unset field is the ARK DEFAULT, shown as a placeholder
// - and Sciter hides a placeholder on focus, so clicking a field looked like it
// wiped the value. Instead we drop the default in as real, editable text (you
// usually want to tweak a default URL, not retype it); leaving the field again
// without changing anything clears it, so an untouched field stays "not set"
// and is never written to the ini.
function wireDefaultPrefill(inp, defStr) {
  if (!defStr) return;
  const val = () => String(inp.value !== undefined && inp.value !== null ? inp.value : "");
  let prefilled = false;
  inp.addEventListener("focus", () => {
    if (val() !== "") return;
    prefilled = true;
    inp.value = defStr;  // programmatic: fires no "input", so nothing is staged
  });
  inp.addEventListener("blur", () => {
    if (prefilled && val() === defStr) inp.value = "";
    prefilled = false;
  });
}

function buildCfgRow(st) {
  const pk = pendKey(st);
  const p = cfgPend();
  const disp = cfgDisplay(st);
  const inDump = !!dumpValues(st);
  const complex = st.type === "array" || st.complex;
  const isset = cfgIsSet(st);
  const defStr = (st.default === undefined || st.default === null) ? "" : String(st.default);
  // Clicking an unset field prefills the default, or - when ARK has no default
  // to show (CustomLiveTuningUrl, most URLs) - the example, so there is always
  // something to edit instead of retype. Safe either way: an untouched prefill
  // is cleared again on blur and never staged (wireDefaultPrefill).
  const exStr = (st.example === undefined || st.example === null) ? "" : String(st.example);

  const row = el(`<div class="cfgrow ${isset ? "isset" : ""}">
      <div class="cleft">
        <div class="cname">${st.key} <span class="qmark">(?)</span></div>
        <div class="chint">${st.file} [${st.section}]</div>
      </div>
      <div class="cval"></div></div>`);
  let tip = st.description + "\nDefault: " + (defStr !== "" ? defStr : "(empty)");
  if (st.example) tip += "\nExample: " + st.example;
  attachTip($(".qmark", row), tip);

  const val = $(".cval", row);
  if (complex) {
    // Family editor: raw display + [Edit] link; editing swaps in a textarea with
    // one full ini line per row. Apply stages the whole family (empty = removal).
    const box = el(`<div>
        <div class="cfgraw"></div>
        <div class="cfgedit" style="display:none">
          <textarea class="cfgta"></textarea>
          ${st.example ? `<div class="cfgexample">Example: <span class="ex"></span><a class="ex-use">insert</a></div>` : ""}
          <div class="cfgtabtns">
            <button class="primary ta-apply">Apply</button>
            <button class="ta-cancel">Cancel</button></div>
        </div>
        <a class="cfgeditlink">Edit</a></div>`);
    const raw = $(".cfgraw", box), edit = $(".cfgedit", box),
          link = $(".cfgeditlink", box), ta = $(".cfgta", box);
    // No placeholder on purpose: Sciter hides it the moment the field gets
    // focus, which read as "my text just vanished". The example lives in the
    // .cfgexample line below instead, where it stays put and can be inserted.
    // Staged family lines win over the ini dump, both here and in the prefill.
    const stagedFam = () => cfgPend().fams[pendKey(st)];
    const paintRaw = () => {
      const fam = stagedFam();
      const lines = fam ? fam.lines : cfgRawLines(st);
      raw.textContent = lines.length ? lines.join("\n") : "not set";
    };
    paintRaw();
    const taVal = () => String(ta.value !== undefined && ta.value !== null ? ta.value : "");
    // Hint-only validation: a non-empty line without '=' marks the textarea, but
    // Apply is never blocked (ARK accepts odd lines; do not over-validate).
    const validate = () => {
      const bad = taVal().split("\n").some(l => l.trim() !== "" && l.indexOf("=") < 0);
      ta.classList.toggle("invalid", bad);
    };
    ta.addEventListener("input", validate);
    // "insert" drops the example in as real, editable text - appended on its
    // own line when the editor already has content.
    //
    // The example line only EXISTS when there is an example (see the template
    // above) and is never display-toggled. The first version rendered it with
    // style="display:none" and switched it to "block" here - a visible child
    // inside the still-hidden .cfgedit block. Sciter 6.0.4.10 then crashed
    // (access violation in sciter.dll, always at offset 0x126f7a) about ten
    // seconds after every Config render, in roughly one run out of three;
    // pinned down with a screen-cycling harness in the loose dev ui copy.
    const exBox = $(".cfgexample", box);
    if (exBox) {
      $(".ex", exBox).textContent = st.example;  // examples carry quotes and '<' - never innerHTML
      $(".ex-use", exBox).addEventListener("click", () => {
        const cur = taVal();
        ta.value = cur.trim() === "" ? String(st.example)
                                     : cur.replace(/\s+$/, "") + "\n" + st.example;
        validate();
        // no ta.focus() here on purpose: it was the only focus() call in the
        // app and landed in the same build as a crash inside sciter.dll
      });
    }
    const showEdit = (on) => {
      edit.style.display = on ? "block" : "none";
      raw.style.display = on ? "none" : "block";
      link.style.display = on ? "none" : "block";
    };
    link.addEventListener("click", () => {
      const fam = stagedFam();
      ta.value = (fam ? fam.lines : cfgFamilyLines(st)).join("\n");
      validate();
      showEdit(true);
    });
    $(".ta-cancel", box).addEventListener("click", () => showEdit(false));
    $(".ta-apply", box).addEventListener("click", () => {
      const lines = taVal().split("\n").map(l => l.trim()).filter(l => l !== "");
      stageFamily(st, lines);   // empty array = stage family removal
      showEdit(false);
      paintRaw();
      updCfgRow(raw, st);
    });
    val.appendChild(box);
  } else if (st.type === "bool") {
    const on = disp.set ? parseBool(disp.val) : parseBool(defStr);
    const t = el(`<div class="toggle ${on ? "on" : ""} ${disp.set ? "" : "dim"}">
        <div class="box"></div><span>${on ? "On" : "Off"}</span></div>`);
    t.addEventListener("click", () => {
      const d = cfgDisplay(st);
      const nv = !(d.set ? parseBool(d.val) : parseBool(defStr));
      stageEdit(st, nv ? "True" : "False");
      t.classList.toggle("on", nv);
      t.classList.remove("dim");
      $("span", t).textContent = nv ? "On" : "Off";
      updCfgRow(t, st);
    });
    val.appendChild(t);
  } else if (st.type === "enum") {
    let opts = `<option value="">(default)</option>`;
    for (const ev of (st.enumValues || []))
      opts += `<option value="${escAttr(ev)}" ${disp.set && disp.val === ev ? "selected" : ""}>${ev}</option>`;
    const sel = el(`<select class="cfgsel">${opts}</select>`);
    sel.addEventListener("change", () => {
      const v = String(sel.value || "");
      if (v === "") unstageEdit(st); else stageEdit(st, v);
      updCfgRow(sel, st);
    });
    val.appendChild(sel);
  } else if (st.type === "int" || st.type === "float") {
    const inp = el(`<input|text class="cfgnum" value="${disp.set ? escAttr(disp.val) : ""}"
        placeholder="${escAttr(defStr)}">`);
    inp.addEventListener("input", () => onCfgNumInput(inp, st, st.type === "float"));
    wireDefaultPrefill(inp, defStr || exStr);
    val.appendChild(inp);
  } else {  // string
    const inp = el(`<input|text class="cfgstr" value="${disp.set ? escAttr(disp.val) : ""}"
        placeholder="${escAttr(defStr)}">`);
    inp.addEventListener("input", () => {
      const v = String(inp.value !== undefined && inp.value !== null ? inp.value : "");
      if (v === "") unstageEdit(st); else stageEdit(st, v);
      inp.classList.remove("invalid");
      updCfgRow(inp, st);
    });
    wireDefaultPrefill(inp, defStr || exStr);
    val.appendChild(inp);
  }

  // Reset "x": only for keys that exist in the ini and aren't already staged for delete.
  if (inDump && !p.dels[pk] && !complex) {
    const rx = el(`<div class="cfgreset">x</div>`);
    attachTip(rx, "Remove from ini - ARK will use the default");
    rx.addEventListener("click", () => { stageDelete(st); if (cfgRefresh) cfgRefresh(); });
    val.appendChild(rx);
  }
  return row;
}

// Deliberate category order: everything about RUNNING the server first, then
// the gameplay knobs. The schema's own order interleaved the two (Rates,
// Harvesting, Creatures, then General, then more gameplay, then Network), so
// scrolling the list felt random. Categories not listed here keep their
// first-appearance position at the end - a new schema category still shows up.
const CFG_CAT_ORDER = [
  // server administration
  "General",
  "Network & Performance",
  "Messages",
  "Cross-ARK/Transfers",
  "Advanced",
  // gameplay
  "Rates",
  "Harvesting",
  "Engrams & Items",
  "Structures",
  "Decay",
  "Players",
  "Tribes",
  "Creatures",
  "Breeding",
  "PvP",
  "PvE",
  "Time & Weather",
];

// Sort the categories present in `names` into CFG_CAT_ORDER, appending unknown
// ones in the order they were given.
function cfgOrderCats(names) {
  const out = CFG_CAT_ORDER.filter(c => names.indexOf(c) >= 0);
  for (const c of names) if (out.indexOf(c) < 0) out.push(c);
  return out;
}

// Inside one category, keep the two ini files apart instead of alternating row
// by row. GameUserSettings first - it is the file people actually edit - then
// Game.ini, then anything else.
function cfgFileRank(st) {
  return st.file === "GameUserSettings" ? 0 : (st.file === "Game" ? 1 : 2);
}

// Is a setting present in the ini right now, or staged to be? Drives the row's
// green "isset" edge and the "Only set" filter.
function cfgIsSet(st) {
  const pk = pendKey(st), p = cfgPend();
  if (st.type === "array" || st.complex)
    return p.fams[pk] ? p.fams[pk].lines.length > 0 : cfgFamilyLines(st).length > 0;
  return !!(p.edits[pk] || (!!dumpValues(st) && !p.dels[pk]));
}

// CommandLine settings live in the launch section, not here; the rest is filtered
// by the server's game, the search text (key or description), the category and
// the "Only set" toggle.
function cfgFiltered(game) {
  const q = cfgState.search.toLowerCase();
  return SCHEMA.settings.filter(st =>
    st.file !== "CommandLine" &&
    st.games.indexOf(game) >= 0 &&
    (!cfgState.cat || st.category === cfgState.cat) &&
    (!cfgState.onlySet || cfgIsSet(st)) &&
    (!q || st.key.toLowerCase().indexOf(q) >= 0 ||
      String(st.description || "").toLowerCase().indexOf(q) >= 0));
}

function renderCfgList(listHost, countEl, game) {
  const items = cfgFiltered(game);
  countEl.textContent = items.length + " setting" + (items.length === 1 ? "" : "s");
  listHost.innerHTML = "";
  // bucket by category, then lay the buckets out in CFG_CAT_ORDER
  const order = [], buckets = {};
  for (const st of items) {
    if (!buckets[st.category]) { buckets[st.category] = []; order.push(st.category); }
    buckets[st.category].push(st);
  }
  for (const cat of cfgOrderCats(order)) {
    const folded = !!cfgState.collapsed[cat];
    const head = el(`<div class="cfgcat ${folded ? "folded" : ""}"><span class="caret">${
        folded ? "&#9656;" : "&#9662;"}</span>${cat.toUpperCase()} <span class="n">${buckets[cat].length}</span></div>`);
    const group = el(`<div class="cfggroup ${folded ? "folded" : ""}"></div>`);
    // Click folds/unfolds in place - no list rebuild - and records it in cfgState.
    head.addEventListener("click", () => {
      const now = !cfgState.collapsed[cat];
      cfgState.collapsed[cat] = now;
      head.classList.toggle("folded", now);
      group.classList.toggle("folded", now);
      $(".caret", head).innerHTML = now ? "&#9656;" : "&#9662;";
    });
    listHost.appendChild(head);
    // Group the category's rows by ini file + section. The index tiebreak keeps
    // the schema's own key order inside a section (related keys stay adjacent),
    // without relying on the engine's sort being stable.
    const rows = buckets[cat].map((st, i) => ({ st: st, i: i }));
    rows.sort((a, b) => {
      const fr = cfgFileRank(a.st) - cfgFileRank(b.st);
      if (fr) return fr;
      if (a.st.section !== b.st.section) return a.st.section < b.st.section ? -1 : 1;
      return a.i - b.i;
    });
    for (const r of rows) group.appendChild(buildCfgRow(r.st));
    listHost.appendChild(group);
  }
  if (!items.length)
    listHost.appendChild(el(`<div class="crumb" style="color:#93A0AE">No settings match the filter.</div>`));
}

function paintCfgFooter() {
  const f = $("#cfgfooter");
  if (!f) return;
  const p = cfgPend();
  const n = Object.keys(p.edits).length + Object.keys(p.dels).length + Object.keys(p.fams).length;
  // The floating footer covers the last rows - give the list room to scroll past it.
  const lh = $("#cfglist");
  if (lh) lh.style.paddingBottom = n ? "72px" : "0";
  if (!n) { f.style.display = "none"; return; }
  $(".cfgn", f).textContent = n + " pending change" + (n === 1 ? "" : "s");
  f.style.display = "flex";
}

// Browser-preview Save target: apply staged changes to the STUB_INI_* objects.
function stubApplyIni(dump, edits, dels) {
  const findSec = name => dump.sections.find(x => x.name.toLowerCase() === name.toLowerCase());
  for (const e of edits) {
    let sec = findSec(e.section);
    if (!sec) { sec = { name: e.section, entries: [] }; dump.sections.push(sec); }
    const ent = sec.entries.find(x => x[0].toLowerCase() === e.key.toLowerCase());
    if (ent) ent[1] = e.value; else sec.entries.push([e.key, e.value]);
  }
  for (const d of dels) {
    const sec = findSec(d.section);
    if (sec) sec.entries = sec.entries.filter(x => x[0].toLowerCase() !== d.key.toLowerCase());
  }
}
// Stub twin of NATIVE.setIniKeyLines: replace a family's lines in a STUB dump
// (remove all family lines, insert the new ones at the first removed position).
function stubApplyFamily(dump, f) {
  let sec = dump.sections.find(x => x.name.toLowerCase() === f.section.toLowerCase());
  const parsed = f.lines.map(ln => {
    const i = ln.indexOf("=");
    return i >= 0 ? [ln.slice(0, i), ln.slice(i + 1)] : [ln, ""];
  });
  if (!sec) {
    if (!parsed.length) return;  // removing from a missing section: nothing to do
    sec = { name: f.section, entries: [] };
    dump.sections.push(sec);
  }
  let at = -1;
  const kept = [];
  sec.entries.forEach((e, i) => {
    if (isFamilyKey(e[0], f.key)) { if (at < 0) at = kept.length; }
    else kept.push(e);
  });
  if (at < 0) at = kept.length;  // no old lines: append at the section end
  kept.splice(at, 0, ...parsed);
  sec.entries = kept;
}

function cfgSave() {
  const s = servers[cur];
  const p = cfgPend();
  const edits = { gus: [], game: [] }, dels = { gus: [], game: [] };
  const fams = [];
  for (const k in p.edits) {
    const e = p.edits[k];
    edits[e.file].push({ section: e.section, key: e.key, value: e.value });
  }
  for (const k in p.dels) {
    const d = p.dels[k];
    dels[d.file].push({ section: d.section, key: d.key });
  }
  for (const k in p.fams) fams.push(p.fams[k]);
  if (NATIVE) {
    // Native side takes plain JS arrays of objects, NOT JSON strings.
    try {
      if (edits.gus.length) NATIVE.saveIniValues(s.id, "gus", edits.gus);
      if (edits.game.length) NATIVE.saveIniValues(s.id, "game", edits.game);
      if (dels.gus.length) NATIVE.deleteIniKeys(s.id, "gus", dels.gus);
      if (dels.game.length) NATIVE.deleteIniKeys(s.id, "game", dels.game);
      // Family rewrites AFTER the profile-API calls (raw section rewrite wins).
      for (const f of fams)
        NATIVE.setIniKeyLines(s.id, f.file, f.section, f.key, f.lines);
    } catch (e) { console.log("ini save failed: " + e); }
  } else {
    stubApplyIni(STUB_INI_GUS, edits.gus, dels.gus);
    stubApplyIni(STUB_INI_GAME, edits.game, dels.game);
    for (const f of fams)
      stubApplyFamily(f.file === "gus" ? STUB_INI_GUS : STUB_INI_GAME, f);
  }
  delete cfgPendingAll[cfgState.serverId];  // this server's staged set is consumed
  cfgState.serverId = null;                 // force a dump reload
  render();
}

function renderConfig(host) {
  const s = servers[cur];
  const game = ensureLaunch(s).game || "ASE";
  ensureCfgDumps(s);

  host.appendChild(el(`<div class="crumb">Config: <b>${s.name}</b>
      <span style="color:#9AA6B4">- changes take effect on the next server start.</span></div>`));

  const cats = [];
  for (const st of SCHEMA.settings)
    if (st.file !== "CommandLine" && cats.indexOf(st.category) < 0) cats.push(st.category);
  let copts = `<option value="" ${cfgState.cat === "" ? "selected" : ""}>All categories</option>`;
  for (const c of cfgOrderCats(cats))  // same order as the list itself
    copts += `<option value="${escAttr(c)}" ${cfgState.cat === c ? "selected" : ""}>${c}</option>`;

  const bar = el(`<div class="cfgbar">
      <input|text class="cfg-search" value="${escAttr(cfgState.search)}" placeholder="Search settings...">
      <select class="cfgsel cfg-cat">${copts}</select>
      <div class="toggle cfg-onlyset ${cfgState.onlySet ? "on" : ""}"><div class="box"></div><span>Only set</span></div>
      <div class="grow"></div>
      <a class="cfgfold cfg-collapse">collapse all</a><span class="cfgfoldsep">&middot;</span><a class="cfgfold cfg-expand">expand all</a>
      <div class="cfgcount"></div></div>`);
  host.appendChild(bar);
  const list = el(`<div id="cfglist"></div>`);
  host.appendChild(list);

  // floating footer lives inside #content so render()'s innerHTML="" cleans it up
  const foot = el(`<div id="cfgfooter"><div class="cfgn"></div>
      <button class="primary cfg-save">Save</button><button class="cfg-discard">Discard</button></div>`);
  $(".cfg-save", foot).addEventListener("click", cfgSave);
  $(".cfg-discard", foot).addEventListener("click", () => {
    delete cfgPendingAll[cfgState.serverId];  // only the CURRENT server's staged set
    render();
  });
  host.appendChild(foot);

  cfgRefresh = () => renderCfgList(list, $(".cfgcount", bar), game);
  const si = $(".cfg-search", bar);
  let deb = null;
  si.addEventListener("input", () => {
    if (deb) clearTimeout(deb);
    deb = setTimeout(() => {
      cfgState.search = String(si.value !== undefined && si.value !== null ? si.value : "");
      cfgRefresh();
    }, 150);
  });
  const cs = $(".cfg-cat", bar);
  cs.addEventListener("change", () => { cfgState.cat = String(cs.value || ""); cfgRefresh(); });
  const os = $(".cfg-onlyset", bar);
  os.addEventListener("click", () => {
    cfgState.onlySet = !cfgState.onlySet;
    os.classList.toggle("on", cfgState.onlySet);
    cfgRefresh();
  });
  // Fold state is per category and lives in cfgState.collapsed, so it survives
  // filter changes, refreshes and switching servers.
  const foldAll = (folded) => {
    for (const c of cats) cfgState.collapsed[c] = folded;
    cfgRefresh();
  };
  $(".cfg-collapse", bar).addEventListener("click", () => foldAll(true));
  $(".cfg-expand", bar).addEventListener("click", () => foldAll(false));

  cfgRefresh();
  paintCfgFooter();
}

function renderLogs(host) {
  const top = el(`<div class="logtop">
      <button class="dbg">${showDebug ? "Debug: on" : "Debug: off"}</button>
      <div class="grow"></div><button class="clr">Clear Log</button></div>`);
  $(".dbg", top).addEventListener("click", () => { showDebug = !showDebug; render(); });
  $(".clr", top).addEventListener("click", () => {
    if (NATIVE) {
      try { NATIVE.clearLogs(); } catch (e) { console.log("clearLogs failed: " + e); }
    } else {
      STUB_LOGS.length = 0;
    }
    logs = loadLogs();
    render();
  });
  host.appendChild(top);
  const box = el(`<div id="logbox"></div>`);
  logs.filter(l => showDebug || !l.dbg).forEach(l => {
    // Two fixed-width tags: [INFO] (blue) for normal entries, [DEBG] (violet)
    // for the verbose tier (debug AND steamcmd types share the DEBG tag).
    const lvl = l.dbg ? "DEBG" : "INFO";
    const lvlColor = l.dbg ? "#A78BFA" : "#7FB0E8";
    // Native entries have no stub color - derive it from the entry type.
    const color = l.c || (l.dbg ? "#9AA6B4" : "#ECF0F5");
    // Normalize \r\n and lone \r (steamcmd progress rewrites) to real line
    // breaks and collapse excessive blank runs; pre-wrap renders them.
    const msg = String(l.m)
      .replace(/\r\n/g, "\n").replace(/\r/g, "\n")
      .replace(/\n{3,}/g, "\n\n").trim();
    const row = el(`<div class="logrow"><div class="t">${l.t}</div><div class="lvl" style="color:${lvlColor}">[${lvl}]</div><div class="m" style="color:${color}"></div></div>`);
    row.querySelector(".m").textContent = msg;  // textContent: no HTML injection from log text
    box.appendChild(row);
  });
  host.appendChild(box);
}

function render() {
  hideTip();  // the element that opened a tip is about to be replaced
  renderSidebar();
  if (screen !== "update") stopUpdPolling();  // leaving the update screen kills its 1s poll
  if (screen !== "settings") stopAupdPolling();  // same for the About update-check poll
  if (screen !== "mods") stopModMetaPoll();      // and for the Workshop backfill
  const host = $("#content");
  host.innerHTML = "";
  // Startup notice: the banner tops every screen until installed or dismissed.
  if (updBannerLatest && !updBannerDismissed) host.appendChild(buildUpdBanner());
  // Only server/mods/config carry the pills; logs, update, add-server and
  // settings are full-width screens (the latter three also need no servers).
  const tabbed = (screen === "server" || screen === "mods" || screen === "config");
  if (tabbed && !servers.length) {
    host.appendChild(el(`<div class="crumb" style="color:#93A0AE">No servers configured. Use "+ Add Server".</div>`));
    return;
  }
  if (tabbed && cur >= servers.length) cur = 0;
  if (tabbed) {
    const pills = el(`<div class="pills">
        <span class="${screen === "server" ? "active" : ""}">Server</span>
        <span class="${screen === "mods" ? "active" : ""}">Mods</span>
        <span class="${screen === "config" ? "active" : ""}">Config</span></div>`);
    pills.children[0].addEventListener("click", () => { screen = "server"; render(); });
    pills.children[1].addEventListener("click", () => { screen = "mods"; render(); });
    pills.children[2].addEventListener("click", () => { screen = "config"; render(); });
    host.appendChild(pills);
  }
  if (screen === "mods") renderMods(host);
  else if (screen === "server") renderServer(host);
  else if (screen === "config") renderConfig(host);
  else if (screen === "update") renderUpdate(host);
  else if (screen === "addserver") renderAddServer(host);
  else if (screen === "settings") renderSettings(host);
  else renderLogs(host);
}

$("#navlogs").addEventListener("click", () => { screen = "logs"; render(); });
$("#addserver").addEventListener("click", () => { screen = "addserver"; render(); });
$("#navsettings").addEventListener("click", () => { screen = "settings"; render(); });
$("#linksite").addEventListener("click", () => openExternal(URL_SITE));
$("#linkdonate").addEventListener("click", () => openExternal(URL_PAYPAL));

pollStatuses();        // seed lastStatus so the first paint shows real dots
render();
startStatusPolling();  // one 2s interval for sidebar dots + the status card

// Startup update notice: the native side auto-checks at app launch (the stub
// mimics that here); take one look ~3s after load and show the banner if an
// update is available (startupUpdatePoll retries briefly while still checking).
if (!NATIVE) stubCheckAppUpdate();
setTimeout(() => startupUpdatePoll(10), 3000);

// One-time binding sanity check, visible only in the Sciter inspector console.
if (NATIVE) { try { console.log("amucore: " + NATIVE.ping()); } catch (e) {} }
</script>
